<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beranda - SUAR</title>
  <style>
    :root {
      --bg: #fffbf0;
      --card: #ffffff;
      --text: #234e70;
      --muted: #4a5568;
      --primary: #f59e0b;
      --accent: #ec4899;
      --highlight: #10b981;
      --shadow: 0 12px 30px rgba(224, 87, 129, 0.14);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #fef3c7 0%, #fce7f3 44%, #dbeafe 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .container {
      width: min(720px, 100%);
      padding: 28px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid #e2e8f0;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .profile-widget {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .profile-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      background: #ffffff;
      padding: 8px 12px;
      font-weight: 700;
      color: #1f2937;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
      transition: transform 0.12s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .profile-btn:hover {
      border-color: #93c5fd;
      background: #eff6ff;
      transform: translateY(-1px);
    }

    .profile-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 10px);
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 12px 25px rgba(15, 23, 42, 0.16);
      min-width: 160px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .profile-menu.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .profile-menu a,
    .profile-menu button {
      display: block;
      width: 100%;
      padding: 10px 13px;
      text-decoration: none;
      color: #1f2937;
      font-weight: 600;
      background: transparent;
      border: none;
      text-align: left;
      cursor: pointer;
    }

    .profile-menu a:hover,
    .profile-menu button:hover {
      background: #f8fafc;
    }

    h1 {
      margin: 0;
      font-size: 1.95rem;
      line-height: 1.1;
      color: #0f172a;
    }

    p.subtitle {
      color: var(--muted);
      margin: 10px 0 24px;
      font-size: 0.99rem;
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 7px 20px rgba(15, 23, 42, 0.06);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
      box-shadow: 0 16px 30px rgba(236, 72, 153, 0.22);
    }

    .card .info {
      display: grid;
      gap: 6px;
    }

    .card .title {
      font-weight: 700;
      font-size: 1.08rem;
      margin: 0;
    }

    .card .desc {
      color: var(--muted);
      margin: 0;
      font-size: 0.93rem;
    }

    .card .arrow {
      font-size: 1.4rem;
      color: var(--primary);
      transition: transform 0.2s ease;
    }

    .card:hover .arrow {
      transform: translateX(5px);
    }

    @media (max-width: 520px) {
      .container { padding: 20px; }
      h1 { font-size: 1.58rem; }
      .grid { gap: 12px; }
      .card { padding: 14px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="top-row">
      <h1>Selamat datang di SUAR</h1>
      <div class="profile-widget" id="profileWidget">
        <button type="button" class="profile-btn" id="profileBtn">
          <span>👤 Profil</span>
          <span>▾</span>
        </button>
        <div class="profile-menu" id="profileMenu" aria-hidden="true">
          <a href="settings.html">⚙️ Settings</a>
          <form action="logout.php" method="post" style="margin:0;">
            <button type="submit">🔓 Logout</button>
          </form>
        </div>
      </div>
    </div>
    <p class="subtitle">Pilih salah satu opsi untuk mengirim pesan atau melihat masukan yang sudah masuk.</p>

    <section class="grid">
      <a href="Isi_pesan_page.php" class="card">
        <div class="info">
          <p class="title">Isi Pesan</p>
          <p class="desc">Kirim feedback atau saran secara cepat.</p>
        </div>
        <span class="arrow">→</span>
      </a>

      <a href="feedback_list.html" class="card">
        <div class="info">
          <p class="title">Lihat Feedback</p>
          <p class="desc">Lihat semua balasan dan status pesan Anda.</p>
        </div>
        <span class="arrow">→</span>
      </a>
    </section>
  </main>

  <script>
    const profileBtn = document.getElementById('profileBtn');
    const profileMenu = document.getElementById('profileMenu');
    const profileWidget = document.getElementById('profileWidget');

    profileBtn.addEventListener('click', () => {
      const isOpen = profileMenu.classList.toggle('show');
      profileMenu.setAttribute('aria-hidden', String(!isOpen));
    });

    document.addEventListener('click', (event) => {
      if (!profileWidget.contains(event.target)) {
        profileMenu.classList.remove('show');
        profileMenu.setAttribute('aria-hidden', 'true');
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        profileMenu.classList.remove('show');
        profileMenu.setAttribute('aria-hidden', 'true');
      }
    });
  </script>
</body>
</html>
